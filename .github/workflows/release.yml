name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1

      - name: Validate release input
        run: |
          set -euo pipefail
          test -n "$CF_API_KEY"
          test -f AtlasLootRevival/AtlasLootRevival.toc
          test -f AtlasLootRevival/AtlasLootRevival_TBC.toc
          test -f AtlasLootRevival/Data/TBC/Instances.lua
          test -f AtlasLootRevival/Data/TBC/Loot.lua
          test -f AtlasLootRevival/Bindings.xml
          test -f AtlasLootRevival/UI/MinimapButton.lua
          test -f AtlasLootRevival/UI/SettingsPanel.lua
          test -f AtlasLootRevival/assets/dropdown-chevron.tga
          test -f AtlasLootRevival/assets/minimap-icon.tga
          grep -qx '## X-Curse-Project-ID: 1666354' AtlasLootRevival/AtlasLootRevival.toc
          grep -qx '## X-Curse-Project-ID: 1666354' AtlasLootRevival/AtlasLootRevival_TBC.toc
          era_version=$(sed -n 's/^## Version: //p' AtlasLootRevival/AtlasLootRevival.toc)
          tbc_version=$(sed -n 's/^## Version: //p' AtlasLootRevival/AtlasLootRevival_TBC.toc)
          runtime_version=$(sed -n 's/^[[:space:]]*VERSION = "\([^"]*\)",/\1/p' AtlasLootRevival/Core/Constants.lua)
          release_ref="${{ inputs.release_ref || github.ref_name }}"
          release_version=${release_ref#v}
          test -n "$era_version"
          test "$era_version" = "$tbc_version"
          test "$era_version" = "$runtime_version"
          test "$era_version" = "$release_version"
          grep -qx '## Interface: 11509' AtlasLootRevival/AtlasLootRevival.toc
          grep -qx '## Interface: 20506' AtlasLootRevival/AtlasLootRevival_TBC.toc
          grep -Fxq 'Data\TBC\Instances.lua' AtlasLootRevival/AtlasLootRevival_TBC.toc
          grep -Fxq 'Data\TBC\Loot.lua' AtlasLootRevival/AtlasLootRevival_TBC.toc
          find AtlasLootRevival -type f -name '*.lua' -print0 | xargs -0 luac5.1 -p

      - name: Package and publish addon
        uses: BigWigsMods/packager@v2
